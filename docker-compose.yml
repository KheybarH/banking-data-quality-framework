version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: banking-dq-postgres
    environment:
      POSTGRES_USER: dq_user
      POSTGRES_PASSWORD: dq_password
      POSTGRES_DB: banking_dq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq_user -d banking_dq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
